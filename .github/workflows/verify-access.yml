# Verify keyless access — the Milestone 0 demonstration.
#
# Proves this repository's automation can authenticate to the dev Google Cloud
# project with NO stored credentials (Workload Identity Federation), then runs
# setup-doctor to confirm the setup. A green run is the deliverable.
#
# Project-specific values come from repository *variables* (set by the one-time
# setup runbook, docs/runbooks/01-keyless-access-setup.md) so nothing
# project-specific is hard-coded here.

name: Verify keyless access

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/verifier/**"
      - ".github/workflows/verify-access.yml"
  workflow_dispatch: {}

# Least privilege for the job: read the repo, and request the OIDC token GitHub
# mints for Workload Identity Federation. id-token: write is mandatory — without
# it, no OIDC token is issued and authentication fails.
permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (keyless via Workload Identity Federation)
        uses: google-github-actions/auth@v3
        with:
          # Impersonate the least-privilege automation service account (chosen
          # over direct WIF: federated tokens cap at ~10 min, too short for real
          # Terraform applies, and a per-environment SA is the identity FND-4 wants).
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install setup-doctor (pinned)
        working-directory: bootstrap/verifier
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Run setup-doctor
        env:
          # Project-specific (from repository variables set by the runbook):
          SETUP_DOCTOR_PROJECT_NUMBER: ${{ vars.GCP_PROJECT_NUMBER }}
          SETUP_DOCTOR_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SETUP_DOCTOR_SERVICE_ACCOUNT: ${{ vars.WIF_SERVICE_ACCOUNT }}
          SETUP_DOCTOR_EXPECTED_IDENTITY: ${{ vars.WIF_SERVICE_ACCOUNT }}
          # Stable for this repo/design (safe to commit):
          SETUP_DOCTOR_POOL_ID: github
          SETUP_DOCTOR_PROVIDER_ID: iac-gke
          SETUP_DOCTOR_REPOSITORY_ID: "1260827836" # kg-aifabrik/iac-gke (immutable)
          SETUP_DOCTOR_REF: refs/heads/main
          SETUP_DOCTOR_EXPECTED_ROLES: roles/serviceusage.serviceUsageViewer
        # In CI the automation SA is least-privilege, so the operator-only
        # structural checks (WIF provider, SA roles) report SKIP; the identity
        # and live-API checks must PASS. Exit is non-zero only on a real FAIL.
        run: setup-doctor --json
