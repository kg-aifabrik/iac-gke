# Terraform destroy — gated teardown.
#
# Manually dispatched, requires typing the root name to confirm, and is held by
# the same `dev` GitHub Environment approval as apply. Used to tear down the
# short-lived dev cluster after milestone verification. Keyless (WIF).
#
# Note: destroying the foundation removes resources from state but the KMS key
# ring/key remain in Google Cloud (Cloud KMS forbids deletion); a later apply
# reuses them. The CAS hierarchy also lives in the foundation (deleted CaPool
# ids are retired FOREVER by Google — never destroy it casually; recreation
# needs new pool names). Normal teardown targets `fop`, not `foundation`.

name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      root:
        description: Which dev root to destroy
        type: choice
        options: [fop, foundation]
        default: fop
      confirm:
        description: Type the root name again to confirm (safety check)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-destroy-${{ github.event.inputs.root }}
  cancel-in-progress: false

jobs:
  destroy:
    # Refuse to run unless the typed confirmation matches the chosen root.
    if: github.event.inputs.confirm == github.event.inputs.root
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_ROOT: terraform/envs/dev/${{ github.event.inputs.root }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_state_bucket: ${{ vars.GCP_PROJECT_ID }}-tf-state
      TF_VAR_operator_members: ${{ vars.SRE_OPERATOR_MEMBERS }}
      TF_VAR_automation_member: serviceAccount:${{ vars.WIF_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (keyless via WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - name: Init
        # readonly: use the committed lock as-is; fail on drift (see cluster-build.md).
        run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -backend-config="bucket=${TF_VAR_state_bucket}"
      # Before destroying, delete the in-cluster Gateways so the GKE Gateway
      # controller releases the Google load-balancer resources it created
      # (forwarding rules, target proxies, backend services, NEGs). Those are not
      # in Terraform state; if the cluster is deleted first the controller dies
      # without garbage-collecting them, and the orphans then block Terraform from
      # deleting the SSL policies, the internal address, and the proxy-only subnet
      # (issue #31). Idempotent: skipped when the cluster's fleet membership is
      # already gone — e.g. a re-run after a partial destroy.
      - name: Delete in-cluster Gateways first (release controller-managed LBs)
        if: github.event.inputs.root == 'fop'
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          cluster="$(terraform -chdir="$TF_ROOT" output -raw cluster_name 2>/dev/null || true)"
          if [ -z "$cluster" ]; then
            echo "No cluster_name output (nothing built); skipping gateway cleanup."
            exit 0
          fi
          # kubectl reaches the (private, no-public-endpoint) cluster over Connect
          # Gateway, which needs gke-gcloud-auth-plugin — not on the runner by default.
          if ! command -v gke-gcloud-auth-plugin >/dev/null 2>&1; then
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
              | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin
          fi
          # If the membership is already gone (idempotent re-run), there is nothing
          # in-cluster to clean — go straight to destroy.
          if ! gcloud container fleet memberships get-credentials "$cluster" --project "${TF_VAR_project_id}" 2>/dev/null; then
            echo "Fleet membership '$cluster' not reachable (already destroyed); skipping gateway cleanup."
            exit 0
          fi
          # The Gateway's finalizer holds the object until the controller has removed
          # its Google load balancers, so a completed delete means the edge resources
          # are now unreferenced and Terraform can delete them.
          if kubectl get gateways.gateway.networking.k8s.io -A >/dev/null 2>&1; then
            kubectl delete gateways.gateway.networking.k8s.io --all --all-namespaces --timeout=600s
            echo "Gateways deleted; controller has released its load balancers."
          else
            echo "No Gateway resources present; nothing to clean."
          fi

      - name: Destroy
        run: terraform -chdir="$TF_ROOT" destroy -auto-approve -no-color -input=false -lock-timeout=120s
