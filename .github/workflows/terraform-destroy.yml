# Terraform destroy — gated teardown.
#
# Manually dispatched, requires typing the root name to confirm, and is held by
# the same `dev` GitHub Environment approval as apply. Used to tear down the
# short-lived dev cluster after milestone verification. Keyless (WIF).
#
# Note: destroying the foundation removes resources from state but the KMS key
# ring/key remain in Google Cloud (Cloud KMS forbids deletion); a later apply
# reuses them. The CAS hierarchy is per-cluster (in `fop`) with random-suffixed
# names, so this destroy removes it cleanly and the next apply regenerates fresh
# ids. Normal teardown targets `fop`, not `foundation`.

name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment (only 'dev' is wired today; stage/prod are modeled but not built)
        type: choice
        options: [dev, stage, prod]
        default: dev
      purpose:
        description: Cluster purpose (or 'foundation' for the per-project root)
        type: choice
        default: fop
        # >>> cluster-factory:purposes — generated from config/clusters.yaml; do not edit by hand
        options:
          - foundation
          - fop
          - mgmt
        # <<< cluster-factory:purposes
      confirm:
        description: Type the purpose again to confirm (safety check)
        type: string
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: tf-destroy-${{ github.event.inputs.env }}-${{ github.event.inputs.purpose }}
  cancel-in-progress: false

jobs:
  destroy:
    # Refuse to run unless the typed confirmation matches the chosen root.
    if: github.event.inputs.confirm == github.event.inputs.purpose
    runs-on: ubuntu-latest
    environment: dev
    env:
      TF_ROOT: terraform/envs/${{ github.event.inputs.env }}/${{ github.event.inputs.purpose }}
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
      TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
      TF_VAR_state_bucket: ${{ vars.GCP_PROJECT_ID }}-tf-state
      TF_VAR_operator_members: ${{ vars.SRE_OPERATOR_MEMBERS }}
      TF_VAR_automation_member: serviceAccount:${{ vars.WIF_SERVICE_ACCOUNT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (keyless via WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - name: Init
        # readonly: use the committed lock as-is; fail on drift (see cluster-build.md).
        run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -backend-config="bucket=${TF_VAR_state_bucket}"
      # Before destroying, delete the in-cluster Gateways so the GKE Gateway
      # controller releases the Google load-balancer resources it created
      # (forwarding rules, target proxies, backend services, NEGs). Those are not
      # in Terraform state; if the cluster is deleted first the controller dies
      # without garbage-collecting them, and the orphans then block Terraform from
      # deleting the SSL policies, the internal address, and the proxy-only subnet
      # (issue #31). Idempotent: skipped when the cluster's fleet membership is
      # already gone — e.g. a re-run after a partial destroy.
      - name: Delete in-cluster Gateways first (release controller-managed LBs)
        if: github.event.inputs.purpose != 'foundation'
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          cluster="$(terraform -chdir="$TF_ROOT" output -raw cluster_name 2>/dev/null || true)"
          if [ -z "$cluster" ]; then
            echo "No cluster_name output (nothing built); skipping gateway cleanup."
            exit 0
          fi
          # kubectl reaches the (private, no-public-endpoint) cluster over Connect
          # Gateway, which needs gke-gcloud-auth-plugin — not on the runner by default.
          if ! command -v gke-gcloud-auth-plugin >/dev/null 2>&1; then
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
              | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin
          fi
          # The plugin shells out to `gcloud config config-helper`, which needs
          # an ACTIVE gcloud account — not just Application Default Credentials.
          # Whether one exists depends on runner-image state (the apt install
          # above can shadow the preinstalled, authenticated gcloud), so
          # activate the workflow's federated credentials explicitly
          # (observed: run 27250995161, "no active account selected").
          gcloud auth login --cred-file="${GOOGLE_APPLICATION_CREDENTIALS}" --quiet
          # If the membership is already gone (idempotent re-run), there is nothing
          # in-cluster to clean — go straight to destroy.
          if ! gcloud container fleet memberships get-credentials "$cluster" --project "${TF_VAR_project_id}" 2>/dev/null; then
            echo "Fleet membership '$cluster' not reachable (already destroyed); skipping gateway cleanup."
            exit 0
          fi
          # The Gateway's finalizer holds the object until the controller has removed
          # its Google load balancers, so a completed delete means the edge resources
          # are now unreferenced and Terraform can delete them.
          if kubectl get gateways.gateway.networking.k8s.io -A >/dev/null 2>&1; then
            kubectl delete gateways.gateway.networking.k8s.io --all --all-namespaces --timeout=600s
            echo "Gateways deleted; controller has released its load balancers."
          else
            echo "No Gateway resources present; nothing to clean."
          fi

      # Before destroying, empty the Backup for GKE plans. The google provider
      # refuses to delete a backup plan (or restore plan) that still contains
      # backups/restores (googleapi Error 400 "has nested resources ... set
      # 'force' to true"), and the daily backup SCHEDULE accrues `sched-*`
      # backups that neither Terraform nor examples/validate.sh removes — so a
      # cluster that ran overnight cannot be destroyed until its plan is drained
      # (observed: run 28883229561, plan dev-fop-daily held three sched-* backups).
      # Scoped to THIS root's own plan outputs, so other clusters/plans in the
      # project are never touched. Idempotent: skipped when nothing was built or
      # the plans are already gone (a re-run after a partial destroy).
      - name: Empty Backup for GKE plans first (delete accumulated backups/restores)
        if: github.event.inputs.purpose != 'foundation'
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
          # gcloud beta's one-time component install otherwise prompts and hangs
          # an unattended run; auto-install instead (same as examples/validate.sh).
          CLOUDSDK_CORE_DISABLE_PROMPTS: "1"
        run: |
          backup_plan="$(terraform -chdir="$TF_ROOT" output -raw backup_plan_name 2>/dev/null || true)"
          restore_plan="$(terraform -chdir="$TF_ROOT" output -raw restore_plan_name 2>/dev/null || true)"
          location="$(terraform -chdir="$TF_ROOT" output -raw location 2>/dev/null || true)"
          if [ -z "$backup_plan" ] && [ -z "$restore_plan" ]; then
            echo "No backup/restore plan outputs (nothing built); skipping backup cleanup."
            exit 0
          fi
          if [ -z "$location" ]; then
            echo "No location output; cannot scope backup cleanup — skipping." >&2
            exit 0
          fi
          # gcloud needs an ACTIVE account (not just ADC) for these calls; activate
          # the workflow's federated credentials explicitly (see the gateway step).
          gcloud auth login --cred-file="${GOOGLE_APPLICATION_CREDENTIALS}" --quiet
          # Restores first: a restore plan cannot be deleted while it holds restores,
          # and restores reference backups. Then the backups. Every list/delete is
          # scoped to this root's own plan, so no other cluster's data is at risk.
          if [ -n "$restore_plan" ]; then
            restores="$(gcloud beta container backup-restore restores list \
              --project "${TF_VAR_project_id}" --location "$location" \
              --restore-plan "$restore_plan" --format='value(name.basename())' 2>/dev/null || true)"
            for r in $restores; do
              echo "Deleting restore $r from $restore_plan"
              gcloud beta container backup-restore restores delete "$r" \
                --project "${TF_VAR_project_id}" --location "$location" \
                --restore-plan "$restore_plan" --quiet || true
            done
          fi
          if [ -n "$backup_plan" ]; then
            backups="$(gcloud beta container backup-restore backups list \
              --project "${TF_VAR_project_id}" --location "$location" \
              --backup-plan "$backup_plan" --format='value(name.basename())' 2>/dev/null || true)"
            for b in $backups; do
              echo "Deleting backup $b from $backup_plan"
              gcloud beta container backup-restore backups delete "$b" \
                --project "${TF_VAR_project_id}" --location "$location" \
                --backup-plan "$backup_plan" --quiet || true
            done
          fi
          echo "Backup/restore plans drained; Terraform can now delete them."

      - name: Destroy
        run: terraform -chdir="$TF_ROOT" destroy -auto-approve -no-color -input=false -lock-timeout=120s
