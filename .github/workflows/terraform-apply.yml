# Terraform apply — gated, serialized, applies a saved plan.
#
# Manually dispatched against one dev root. The run plans first, then waits on
# the `dev` GitHub Environment whose required reviewers are the SRE approver
# list — an apply cannot proceed without an explicit human approval. The apply
# job consumes the *saved* plan from the plan job (same run), so what is applied
# is exactly what was reviewed. Concurrency serializes applies per root and
# never cancels one in flight. Keyless (WIF); no stored credentials.

name: Terraform apply

on:
  workflow_dispatch:
    inputs:
      root:
        description: Which dev root to apply
        type: choice
        options: [foundation, fop]
        default: fop

permissions:
  contents: read
  id-token: write

# Serialize applies for a given root; never cancel a running apply (mid-apply
# cancellation can corrupt state).
concurrency:
  group: tf-apply-${{ github.event.inputs.root }}
  cancel-in-progress: false

env:
  TF_ROOT: terraform/envs/dev/${{ github.event.inputs.root }}
  TF_IN_AUTOMATION: "true"
  TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
  TF_VAR_region: ${{ vars.GCP_REGION || 'us-central1' }}
  TF_VAR_state_bucket: ${{ vars.GCP_PROJECT_ID }}-tf-state
  TF_VAR_operator_members: ${{ vars.SRE_OPERATOR_MEMBERS }}
  TF_VAR_automation_member: serviceAccount:${{ vars.WIF_SERVICE_ACCOUNT }}

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (keyless via WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - name: Init
        # readonly: use the committed lock as-is; fail on drift (see cluster-build.md).
        run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -backend-config="bucket=${TF_VAR_state_bucket}"
      - name: Plan
        run: terraform -chdir="$TF_ROOT" plan -no-color -input=false -lock-timeout=120s -out=tfplan
      - name: Upload saved plan
        uses: actions/upload-artifact@v4
        with:
          name: apply-plan-${{ github.event.inputs.root }}
          path: ${{ env.TF_ROOT }}/tfplan
          retention-days: 1

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # The gate: this environment's required reviewers are the SRE approver list.
    # The job is held until one of them approves the run.
    environment: dev
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Authenticate to Google Cloud (keyless via WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.5"
          terraform_wrapper: false
      - name: Init
        # readonly: use the committed lock as-is; fail on drift (see cluster-build.md).
        run: terraform -chdir="$TF_ROOT" init -input=false -lockfile=readonly -backend-config="bucket=${TF_VAR_state_bucket}"
      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: apply-plan-${{ github.event.inputs.root }}
          path: ${{ env.TF_ROOT }}
      - name: Apply the saved plan
        run: terraform -chdir="$TF_ROOT" apply -no-color -input=false -lock-timeout=120s tfplan

      # The cluster's in-cluster objects are not in Terraform state (the cluster
      # has no public endpoint; see the access module). Apply the platform
      # manifests the stack rendered (operator RBAC + encrypted StorageClass)
      # over Connect Gateway, once the cluster exists.
      - name: Install TLS add-ons and apply in-cluster manifests over Connect Gateway
        if: github.event.inputs.root == 'fop'
        env:
          USE_GKE_GCLOUD_AUTH_PLUGIN: "True"
        run: |
          # kubectl needs gke-gcloud-auth-plugin to authenticate through Connect
          # Gateway. The runner's gcloud has neither the component manager nor the
          # Cloud SDK apt repo, so add the repo explicitly, then install.
          if ! command -v gke-gcloud-auth-plugin >/dev/null 2>&1; then
            curl -fsSL https://packages.cloud.google.com/apt/doc/apt-key.gpg \
              | sudo gpg --dearmor -o /usr/share/keyrings/cloud.google.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloud.google.gpg] https://packages.cloud.google.com/apt cloud-sdk main" \
              | sudo tee /etc/apt/sources.list.d/google-cloud-sdk.list >/dev/null
            sudo apt-get update -qq
            sudo apt-get install -y -qq google-cloud-cli-gke-gcloud-auth-plugin
          fi
          # The plugin shells out to `gcloud config config-helper`, which needs
          # an ACTIVE gcloud account — not just Application Default Credentials.
          # Whether one exists depends on runner-image state (the apt install
          # above can shadow the preinstalled, authenticated gcloud), so
          # activate the workflow's federated credentials explicitly
          # (observed: run 27250995161, "no active account selected").
          gcloud auth login --cred-file="${GOOGLE_APPLICATION_CREDENTIALS}" --quiet
          cluster="$(terraform -chdir="$TF_ROOT" output -raw cluster_name)"
          gsa="$(terraform -chdir="$TF_ROOT" output -raw cert_manager_gsa_email)"
          terraform -chdir="$TF_ROOT" output -raw incluster_manifests > incluster.yaml
          terraform -chdir="$TF_ROOT" output -raw priorityclass_manifests > priorityclasses.yaml
          gcloud container fleet memberships get-credentials "$cluster" --project "${TF_VAR_project_id}"

          # The platform PriorityClasses must exist BEFORE the Helm installs
          # below reference them — admission rejects pods whose
          # priorityClassName doesn't exist (design §5).
          kubectl apply -f priorityclasses.yaml

          # Install the pinned TLS controllers; their CRDs must exist before the
          # manifests below (GoogleCASClusterIssuer, Bundle) are applied. The
          # google-cas-issuer KSA is annotated for Workload Identity (no keys).
          # cert-manager runs HA (2 replicas per component + PodDisruptionBudgets,
          # platform-critical priority) so a node drain never stops issuance;
          # trust-manager/google-cas-issuer stay single-replica deliberately — a
          # PDB on one replica blocks drains, and renewals are asynchronous.
          helm repo add jetstack https://charts.jetstack.io --force-update
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            -n cert-manager --create-namespace --version v1.16.2 --set crds.enabled=true \
            --set global.priorityClassName=platform-critical \
            --set replicaCount=2 --set podDisruptionBudget.enabled=true \
            --set webhook.replicaCount=2 --set webhook.podDisruptionBudget.enabled=true \
            --set cainjector.replicaCount=2 --set cainjector.podDisruptionBudget.enabled=true \
            --wait --timeout 600s
          helm upgrade --install trust-manager jetstack/trust-manager \
            -n cert-manager --version v0.13.0 --wait --timeout 600s
          helm upgrade --install google-cas-issuer jetstack/cert-manager-google-cas-issuer \
            -n cert-manager --version v0.11.0 \
            --set "serviceAccount.annotations.iam\.gke\.io/gcp-service-account=${gsa}" --wait --timeout 600s

          # Apply the platform manifests. Gateway IAM granted in this same apply
          # may need a moment to propagate.
          for attempt in 1 2 3 4 5; do
            if kubectl apply -f incluster.yaml; then exit 0; fi
            echo "Apply attempt ${attempt} failed; waiting for gateway IAM to propagate..."
            sleep 15
          done
          echo "::error::Failed to apply in-cluster manifests after retries" && exit 1
