# trust-manager Bundle: distribute the CAS root to every namespace so workload
# clients can verify internal endpoints served by CAS-issued certificates.
#
# The source ConfigMap `cas-root` (key ca.crt = the root PEM) is rendered by the
# env wiring from the private-ca module's root_ca_pem output. trust-manager syncs
# the bundle out as a ConfigMap named `cas-root` (key ca.crt) in each namespace;
# with no namespaceSelector it targets all namespaces.
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: cas-root
spec:
  sources:
    - configMap:
        name: cas-root
        key: ca.crt
  target:
    configMap:
      key: ca.crt
