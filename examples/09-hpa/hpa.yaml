# Horizontal Pod Autoscaler validation: a small web service with a CPU-based
# HPA, plus a load generator that drives utilization past the target. The pod
# layer scales on METRICS (HPA); the node layer scales on PENDING PODS
# (cluster autoscaler, 08-autoscale) — two different triggers, deliberately
# validated separately.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-web
  namespace: examples
  labels:
    app: hpa-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-web
  template:
    metadata:
      labels:
        app: hpa-web
    spec:
      priorityClassName: workload-default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            # A small request so the load generator can push utilization far
            # past the HPA target quickly.
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-web
  namespace: examples
spec:
  selector:
    app: hpa-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-web
  namespace: examples
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-web
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 30
---
# Load generator: two busy request loops against the service — enough to push
# a 50m-request container well past 30% utilization.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-load
  namespace: examples
  labels:
    app: hpa-load
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hpa-load
  template:
    metadata:
      labels:
        app: hpa-load
    spec:
      priorityClassName: workload-default
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: ${REGISTRY_PROXY}/library/busybox:1.36
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://hpa-web || true; done"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 200m, memory: 32Mi }
