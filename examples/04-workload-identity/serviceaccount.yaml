# Kubernetes service account bound to a Google service account via Workload
# Identity. The annotation is what makes pods using this KSA authenticate to
# Google APIs as ${WI_GSA} — no key files, no node-SA credentials.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: wi-demo
  namespace: examples
  annotations:
    iam.gke.io/gcp-service-account: ${WI_GSA}
