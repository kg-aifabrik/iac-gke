# Multi-subdomain routing example — two web services (helloworld1/helloworld2)
# behind the SAME public gateway, reached through THREE subdomains, fanned out
# by URL path: https://sdN.dev.arthos.app/h1 -> helloworld1 and /h2 ->
# helloworld2, for N in 1..3. Each subdomain carries its own publicly-trusted
# managed certificate served by SNI (ADR-0005); the hostnames are provisioned
# by adding them to `external_hostnames` in config/clusters.yaml. Every
# response body names the service AND the subdomain it was reached through
# (nginx echoes the Host header), so routing is observable end to end.
# See README.md next to this file for the full configuration walk-through.
#
# Unlike 05 (the HA reference), this example runs 1 replica per service — it
# demonstrates ROUTING, not availability; the security posture is still the
# compliant baseline every example carries.
apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld1-conf
  namespace: public-services
data:
  # $host is the SNI/Host name the client used — echoing it proves WHICH
  # subdomain the request travelled through, not just that it arrived.
  default.conf: |
    server {
      listen 8080;
      default_type text/plain;
      location / {
        return 200 "service=helloworld1 host=$host path=$uri\n";
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: helloworld2-conf
  namespace: public-services
data:
  default.conf: |
    server {
      listen 8080;
      default_type text/plain;
      location / {
        return 200 "service=helloworld2 host=$host path=$uri\n";
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld1
  namespace: public-services
  labels:
    app: helloworld1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloworld1
  template:
    metadata:
      labels:
        app: helloworld1
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # Readiness gates the load balancer's backend health — the gateway
          # only routes to ready pods.
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: conf, configMap: { name: helloworld1-conf } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloworld2
  namespace: public-services
  labels:
    app: helloworld2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helloworld2
  template:
    metadata:
      labels:
        app: helloworld2
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: conf, configMap: { name: helloworld2-conf } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: helloworld1
  namespace: public-services
spec:
  selector:
    app: helloworld1
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: helloworld2
  namespace: public-services
spec:
  selector:
    app: helloworld2
  ports:
    - port: 80
      targetPort: 8080
---
# One route claims all three subdomains and fans out by path: the gateway's
# URL map matches host + path, so /h1 and /h2 on ANY of the three hostnames
# reach their service. Paths are matched as prefixes and passed through
# unrewritten — the backends answer on every path, and the echoed `path=`
# proves what the gateway forwarded. Anything else on these hosts gets the
# gateway's 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multi-subdomain
  namespace: public-services
spec:
  parentRefs:
    - name: external
      namespace: gateway-system
      sectionName: https
  hostnames:
    - ${MULTI_HOST_1}
    - ${MULTI_HOST_2}
    - ${MULTI_HOST_3}
  rules:
    - matches:
        - path: { type: PathPrefix, value: /h1 }
      backendRefs:
        - name: helloworld1
          port: 80
    - matches:
        - path: { type: PathPrefix, value: /h2 }
      backendRefs:
        - name: helloworld2
          port: 80
