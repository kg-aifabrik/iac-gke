# External ingress example — hello-web exposed on the public gateway over HTTPS.
# Lives in the public-services namespace (labelled ingress=external), so its
# HTTPRoute attaches to the platform external gateway. Served with a
# publicly-trusted Certificate Manager cert at app.dev.arthos.app.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-web
  namespace: public-services
data:
  index.html: |
    Hello World
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: public-services
  labels:
    app: hello-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: html, configMap: { name: hello-web } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: public-services
spec:
  selector:
    app: hello-web
  ports:
    - port: 80
      targetPort: 8080
---
# Attaches to the external gateway's HTTPS listener and routes the public
# hostname to the Service. The gateway terminates TLS with the managed cert.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-web
  namespace: public-services
spec:
  parentRefs:
    - name: external
      namespace: gateway-system
      sectionName: https
  hostnames:
    - app.dev.arthos.app
  rules:
    - backendRefs:
        - name: hello-web
          port: 80
