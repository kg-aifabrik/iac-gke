# External ingress example — hello-web exposed on the public gateway over
# HTTPS, serving BOTH external hostnames (multi-host gateway, ADR-0005). Lives
# in the public-services namespace (labelled ingress=external). This is the
# production-serving reference shape: 2 replicas spread across zones, probes,
# a PodDisruptionBudget, and the workload-high priority tier — the drain and
# rolling-deploy validations assert zero failed requests against it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-web
  namespace: public-services
data:
  index.html: |
    Hello World
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: public-services
  labels:
    app: hello-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      # Production-serving tier: schedules ahead of (and may preempt) default
      # workloads under pressure (platform scheduling tiers, design §5).
      priorityClassName: workload-high
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # One replica per zone where possible — a zone event or a drained node
      # never takes both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello-web
      containers:
        - name: web
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          # Readiness gates the load balancer's backend health — required for
          # zero-downtime rollouts (the gateway only routes to ready pods).
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: html, configMap: { name: hello-web } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
# At most one replica may be evicted by voluntary disruptions (drains,
# upgrades) — the other keeps serving through the gateway.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello-web
  namespace: public-services
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hello-web
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: public-services
spec:
  selector:
    app: hello-web
  ports:
    - port: 80
      targetPort: 8080
---
# Attaches to the external gateway's HTTPS listener and claims both public
# hostnames; the gateway serves each host's own managed certificate by SNI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-web
  namespace: public-services
spec:
  parentRefs:
    - name: external
      namespace: gateway-system
      sectionName: https
  hostnames:
    - ${EXTERNAL_HOST_1}
    - ${EXTERNAL_HOST_2}
  rules:
    - backendRefs:
        - name: hello-web
          port: 80
