# A non-root web Deployment that returns "Hello World" — the end-user smoke
# test (a client call must get HTTP 200 with that body). Doubles as the
# compliant reference: non-root, read-only root filesystem, all capabilities
# dropped, seccomp RuntimeDefault, resource requests/limits, spread across zones.
# The image is pulled through the Artifact Registry Docker Hub proxy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: examples
  labels:
    app: hello-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      # Normal workloads run at the explicit default tier (platform scheduling
      # tiers, design §5) — self-documenting, no implicit behavior change.
      priorityClassName: workload-default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Resilience: prefer one replica per zone, but schedule anyway if a zone
      # is full (dev has one small node per zone).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello-web
      containers:
        - name: web
          # nginx-unprivileged listens on 8080 as UID 101 (no root needed).
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
            # Read-only root filesystem: nginx still needs these paths writable.
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
      volumes:
        - name: html
          configMap:
            name: hello-web-html
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: run
          emptyDir: {}
