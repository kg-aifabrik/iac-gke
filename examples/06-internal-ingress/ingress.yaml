# Internal ingress example — hello-web exposed on the internal gateway over
# HTTPS, serving BOTH internal hostnames (multi-SAN CAS cert, ADR-0005). Lives
# in the internal-tools namespace (labelled ingress=internal). The hostnames
# resolve through the Cloud DNS private zone (ADR-0006) — clients use names,
# never the VIP — and the validation verifies the cert against the CAS root.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-web
  namespace: internal-tools
data:
  index.html: |
    Hello World
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-web
  namespace: internal-tools
  labels:
    app: hello-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      priorityClassName: workload-default
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: hello-web
      containers:
        - name: web
          image: ${REGISTRY_PROXY}/nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          securityContext:
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 100m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
            - { name: run, mountPath: /var/run }
      volumes:
        - { name: html, configMap: { name: hello-web } }
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
        - { name: run, emptyDir: {} }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: hello-web
  namespace: internal-tools
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: hello-web
---
apiVersion: v1
kind: Service
metadata:
  name: hello-web
  namespace: internal-tools
spec:
  selector:
    app: hello-web
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-web
  namespace: internal-tools
spec:
  parentRefs:
    - name: internal
      namespace: gateway-system
      sectionName: https
  hostnames:
    - ${INTERNAL_HOST_1}
    - ${INTERNAL_HOST_2}
  rules:
    - backendRefs:
        - name: hello-web
          port: 80
